# Nginx configuration for ussy.host — USSYSITE4 ("The Helix Organum")
#
# Managed by Certbot for TLS. This is the production config with three
# performance fixes applied versus the previous revision:
#   1. gzip compression (JS/CSS/JSON/SVG)  — ~2.35 MB -> ~480 KB on first load
#   2. Immutable long-lived caching for the version-pinned vendored Three.js
#   3. A catch-all `location /api/` proxy so the site's backend routes
#      (e.g. /api/anomaly/state) reach the Node server on :3019
#
# Apply (as root):
#   cp deploy/nginx-ussy.host.conf /etc/nginx/sites-available/ussy.host
#   ln -sf /etc/nginx/sites-available/ussy.host /etc/nginx/sites-enabled/ussy.host
#   nginx -t && systemctl reload nginx

server {
    if ($host = www.ussy.host) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = ussy.host) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ussy.host www.ussy.host;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;




}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ussy.host www.ussy.host;

    root /home/mojo/web/out;
    index index.html index.htm;
    ssl_certificate /etc/letsencrypt/live/ussy.host/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ussy.host/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Performance: compression -------------------------------------------------
    # The site ships a vendored Three.js build (~2.1 MB raw / ~420 KB gzip).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/wasm;
    # Brotli is ~20% smaller again if the ngx_brotli module is available:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/wasm;

    # ---- Performance: immutable caching for the version-pinned vendor tree --------
    location ^~ /js/vendor/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Webring API proxy
    location /api/webring {
        proxy_pass http://127.0.0.1:8420;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location ^~ /flyer {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }


    # USSYVERSE TTS backend proxy
    location ^~ /api/tts {
        proxy_pass http://127.0.0.1:3019;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /api/orchestrate {
        proxy_pass http://127.0.0.1:3019;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /api/orchestrator {
        proxy_pass http://127.0.0.1:3019;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # USSYSITE4 backend catch-all (/api/health, /api/anomaly/state, ...)
    location /api/ {
        proxy_pass http://127.0.0.1:3019;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }


    location ~* \.html$ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://ussyco.de https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://ussyco.de https://openrouter.ai https://unpkg.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:; worker-src blob:; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location = / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://ussyco.de https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://ussyco.de https://openrouter.ai https://unpkg.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:; worker-src blob:; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }


}
